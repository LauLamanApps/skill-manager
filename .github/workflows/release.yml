name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the app bundle (e.g. 1.2.3)"
        required: true
        default: "0.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ inputs.version }}"
          fi
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Build DMG
        run: |
          chmod +x scripts/make-dmg.sh
          ./scripts/make-dmg.sh "SkillManager-${{ steps.version.outputs.version }}.dmg"

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "SkillManager-${{ steps.version.outputs.version }}.dmg" --clobber

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SkillManager-${{ steps.version.outputs.version }}
          path: SkillManager-${{ steps.version.outputs.version }}.dmg

      - name: Update release notes
        if: github.event_name == 'release'
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python3 scripts/update-release-notes.py "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASENOTES.md
          if git diff --cached --quiet; then
            echo "RELEASENOTES.md already up to date, nothing to commit"
          else
            git commit -m "docs: release notes for v${{ steps.version.outputs.version }}"
            git push origin main
          fi
